[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-fail-under=85
 --cov-report html:'../../coverage/projects/api/html'
 --cov-report xml:'../../coverage/projects/api/coverage.xml'
 --html='../../reports/projects/api/unittests/html/index.html'
 --junitxml='../../reports/projects/api/unittests/junit.xml'
"""

[project]
name = "api"
version = "0.0.0"
description = "FastAPI application"
requires-python = ">=3.14,<4"
readme = 'README.md'
dependencies = [
  "fastapi>=0.141.1",
  "httpx2>=2.9.1",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.0.51",
  "uvicorn[standard]>=0.52.1",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "ruff>=0.16.2",
  "pytest>=9.1.1",
  "pytest-sugar>=1.1.1",
  "pytest-cov>=7.1.0",
  "pytest-html>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
