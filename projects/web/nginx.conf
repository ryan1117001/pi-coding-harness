# Static-serving config for the production `web` image.
# Runs under nginx-unprivileged, which listens on 8080 as a non-root user.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are content-addressed — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes (TanStack Router),
    # so serve index.html and let the app router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
